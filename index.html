<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Lima's Hair</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="admin-header">
    <div class="admin-header-inner">
      <div class="header-brand">
        <span class="header-logo">Lima's Hair</span>
        <span class="header-badge">Administration</span>
      </div>
      <div class="header-stats">
        <div class="stat-pill stat-pending">
          <i class="fa-solid fa-clock"></i>
          <span id="count-pending">0</span>
        </div>
        <div class="stat-pill stat-accepted">
          <i class="fa-solid fa-check"></i>
          <span id="count-accepted">0</span>
        </div>
        <div class="stat-pill stat-refused">
          <i class="fa-solid fa-xmark"></i>
          <span id="count-refused">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== CONTENU PRINCIPAL ==================== -->
  <main class="admin-main">

    <p class="admin-subtitle">
      <i class="fa-brands fa-whatsapp"></i>
      Accepter ou refuser une réservation envoie automatiquement un message WhatsApp au client.
    </p>

    <!-- Barre de filtres -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">
        Toutes <span class="filter-count" id="fc-all">0</span>
      </button>
      <button class="filter-btn" data-filter="en attente">
        <i class="fa-solid fa-clock"></i> En attente <span class="filter-count" id="fc-pending">0</span>
      </button>
      <button class="filter-btn" data-filter="accepté">
        <i class="fa-solid fa-check"></i> Acceptées <span class="filter-count" id="fc-accepted">0</span>
      </button>
      <button class="filter-btn" data-filter="refusé">
        <i class="fa-solid fa-xmark"></i> Refusées <span class="filter-count" id="fc-refused">0</span>
      </button>
    </div>

    <!-- Liste des réservations -->
    <div id="liste"></div>

    <!-- État vide -->
    <div id="vide" class="empty-state" style="display:none;">
      <i class="fa-regular fa-calendar-xmark"></i>
      <p>Aucune réservation pour le moment.</p>
      <span>Les nouvelles réservations apparaîtront ici automatiquement dès qu'un client en fera une sur le site.</span>
    </div>

  </main>

  <!-- ── Script admin en module ES (requis pour Firebase) ── -->
  <script type="module" src="script.js"></script>

</body>
</html>
